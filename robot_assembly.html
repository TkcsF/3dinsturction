<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embroidery Robot - Build Instructions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        .viewer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        
        #canvas {
            flex: 1;
            display: block;
        }
        
        .animation-controls {
            background: #222;
            padding: 16px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        
        .animation-controls button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .animation-controls button:hover {
            background: #0052a3;
        }
        
        .info-section {
            width: 380px;
            background: #1a1a1a;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .step-header {
            background: #2a2a2a;
            padding: 24px 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        
        .step-number {
            font-size: 28px;
            font-weight: 700;
            color: #ff9500;
            margin-bottom: 8px;
        }
        
        .step-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }
        
        .step-description {
            font-size: 14px;
            line-height: 1.5;
            color: #b0b0b0;
        }
        
        .step-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .info-group {
            margin-bottom: 24px;
        }
        
        .info-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .parts-list {
            list-style: none;
        }
        
        .parts-list li {
            font-size: 14px;
            color: #d0d0d0;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .parts-list li:last-child {
            border-bottom: none;
        }
        
        .parts-list li::before {
            content: "• ";
            color: #ff9500;
            margin-right: 8px;
        }
        
        .tools-text {
            font-size: 14px;
            color: #d0d0d0;
            line-height: 1.5;
        }
        
        .navigation {
            background: #2a2a2a;
            padding: 16px 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }
        
        .nav-button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
        }
        
        .nav-button:hover:not(:disabled) {
            background: #444;
            border-color: #555;
        }
        
        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .nav-button.active {
            background: #0066cc;
            border-color: #0066cc;
            color: white;
        }
        
        .step-counter {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 12px 0;
        }
        
        .hidden {
            display: none !important;
        }
        
        .error-message {
            background: #8b0000;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 6px;
            margin: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .viewer-section {
                border-right: none;
                border-bottom: 1px solid #333;
                height: 60%;
            }
            
            .info-section {
                width: 100%;
                height: 40%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-section">
            <canvas id="canvas"></canvas>
            <div class="animation-controls">
                <button id="replayBtn">↻ Replay Animation</button>
            </div>
        </div>
        
        <div class="info-section">
            <div class="step-header">
                <div class="step-number">Step <span id="stepNum">1</span></div>
                <div class="step-title" id="stepTitle">Loading...</div>
                <div class="step-description" id="stepDesc">Loading step information...</div>
            </div>
            
            <div class="step-content">
                <div class="info-group">
                    <div class="info-label">Parts used</div>
                    <ul class="parts-list" id="partsList"></ul>
                </div>
                
                <div class="info-group">
                    <div class="info-label">Tools needed</div>
                    <div class="tools-text" id="toolsText">No tools required</div>
                </div>
            </div>
            
            <div class="step-counter">
                <span id="stepCounter">Step 1 of 1</span>
            </div>
            
            <div class="navigation">
                <button class="nav-button" id="prevBtn">← Previous</button>
                <button class="nav-button active" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, model;
        let currentStep = 0;
        let stepsData = [];
        let animationInProgress = false;
        let visibleParts = new Set();
        
        const config = {
            modelFile: 'robot.glb',
            steps: []
        };
        
        async function loadConfig() {
            try {
                const response = await fetch('steps_config.json');
                const data = await response.json();
                config.modelFile = data.modelFile || 'robot.glb';
                stepsData = data.steps || [];
                
                if (stepsData.length === 0) {
                    throw new Error('No steps defined in configuration');
                }
            } catch (error) {
                console.error('Error loading config:', error);
                document.body.innerHTML = `<div class="error-message">Error loading configuration: ${error.message}</div>`;
            }
        }
        
        async function initThreeJs() {
            const canvas = document.getElementById('canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 2);
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
            light1.position.set(5, 10, 5);
            scene.add(light1);
            
            const light2 = new THREE.DirectionalLight(0xffffff, 0.4);
            light2.position.set(-5, -10, -5);
            scene.add(light2);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function onWindowResize() {
            const canvas = document.getElementById('canvas');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }
        
        async function loadModel() {
            const loader = new THREE.GLTFLoader();
            try {
                const gltf = await new Promise((resolve, reject) => {
                    loader.load(config.modelFile, resolve, undefined, reject);
                });
                
                model = gltf.scene;
                scene.add(model);
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                fitCameraToObject();
                animate();
            } catch (error) {
                console.error('Error loading model:', error);
                document.body.innerHTML = `<div class="error-message">Error loading 3D model: ${error.message}</div>`;
            }
        }
        
        function fitCameraToObject() {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 1.5;
            
            camera.position.z = cameraZ;
            camera.lookAt(model.position);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (model) {
                model.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        
        function hideAllParts() {
            if (!model) return;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.visible = false;
                }
            });
            visibleParts.clear();
        }
        
        function showPart(partName, animate = false) {
            if (!model) return;
            
            let found = false;
            model.traverse((child) => {
                if (child.name === partName && child.isMesh) {
                    found = true;
                    if (animate) {
                        child.position.set(Math.random() * 5 - 2.5, Math.random() * 5 - 2.5, -3);
                        child.visible = true;
                        
                        const material = child.material.clone();
                        material.emissive = new THREE.Color(0xff9500);
                        material.emissiveIntensity = 0.5;
                        child.material = material;
                        
                        const targetPos = child.position.clone();
                        targetPos.set(0, 0, 0);
                        
                        let startTime = Date.now();
                        const duration = 800;
                        
                        const animateIn = () => {
                            const elapsed = Date.now() - startTime;
                            const progress = Math.min(elapsed / duration, 1);
                            
                            child.position.lerp(targetPos, progress);
                            child.scale.lerp(new THREE.Vector3(1, 1, 1), progress);
                            
                            if (progress < 1) {
                                requestAnimationFrame(animateIn);
                            } else {
                                child.position.copy(targetPos);
                                child.scale.set(1, 1, 1);
                                material.emissiveIntensity = 0;
                            }
                        };
                        animateIn();
                    } else {
                        child.visible = true;
                    }
                    visibleParts.add(partName);
                }
            });
            
            return found;
        }
        
        async function loadStep(stepIndex) {
            if (stepIndex < 0 || stepIndex >= stepsData.length) return;
            
            currentStep = stepIndex;
            const step = stepsData[stepIndex];
            
            document.getElementById('stepNum').textContent = step.stepNumber;
            document.getElementById('stepTitle').textContent = step.title;
            document.getElementById('stepDesc').textContent = step.description;
            document.getElementById('stepCounter').textContent = `Step ${step.stepNumber} of ${stepsData.length}`;
            
            const partsList = document.getElementById('partsList');
            partsList.innerHTML = '';
            step.partsUsedNames.forEach((partName) => {
                const li = document.createElement('li');
                li.textContent = partName;
                partsList.appendChild(li);
            });
            
            document.getElementById('toolsText').textContent = step.tools || 'No tools required';
            
            document.getElementById('prevBtn').disabled = stepIndex === 0;
            document.getElementById('nextBtn').disabled = stepIndex === stepsData.length - 1;
            
            await playStepAnimation(step);
            updateNavigation();
        }
        
        async function playStepAnimation(step) {
            animationInProgress = true;
            
            const shouldResetVisibility = currentStep === 0 || 
                (currentStep > 0 && stepsData[currentStep - 1].subAssembly !== step.subAssembly);
            
            if (shouldResetVisibility) {
                hideAllParts();
            }
            
            const delay = 200;
            for (let i = 0; i < step.partsToShow.length; i++) {
                showPart(step.partsToShow[i], true);
                if (i < step.partsToShow.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            
            animationInProgress = false;
        }
        
        function updateNavigation() {
            const isFirst = currentStep === 0;
            const isLast = currentStep === stepsData.length - 1;
            
            document.getElementById('prevBtn').disabled = isFirst;
            document.getElementById('nextBtn').disabled = isLast;
        }
        
        async function init() {
            await loadConfig();
            await initThreeJs();
            await loadModel();
            
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentStep > 0) loadStep(currentStep - 1);
            });
            
            document.getElementById('nextBtn').addEventListener('click', () => {
                if (currentStep < stepsData.length - 1) loadStep(currentStep + 1);
            });
            
            document.getElementById('replayBtn').addEventListener('click', () => {
                if (!animationInProgress) {
                    playStepAnimation(stepsData[currentStep]);
                }
            });
            
            if (stepsData.length > 0) {
                loadStep(0);
            }
        }
        
        init();
    </script>
</body>
</html>
