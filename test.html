<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Half Robot Test - Rotatable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        .viewer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            background: #0a0a0a;
        }
        
        canvas { 
            flex: 1;
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info-section {
            width: 380px;
            background: #1a1a1a;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .step-header {
            background: #2a2a2a;
            padding: 24px 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        
        .step-number {
            font-size: 28px;
            font-weight: 700;
            color: #ff9500;
            margin-bottom: 8px;
        }
        
        .step-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }
        
        .step-description {
            font-size: 14px;
            line-height: 1.5;
            color: #b0b0b0;
        }
        
        .step-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .info-group {
            margin-bottom: 24px;
        }
        
        .info-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .parts-list {
            list-style: none;
        }
        
        .parts-list li {
            font-size: 14px;
            color: #d0d0d0;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .parts-list li:last-child {
            border-bottom: none;
        }
        
        .parts-list li::before {
            content: "• ";
            color: #ff9500;
            margin-right: 8px;
        }
        
        .tools-text {
            font-size: 14px;
            color: #d0d0d0;
            line-height: 1.5;
        }
        
        .step-counter {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 12px 0;
        }
        
        .navigation {
            background: #2a2a2a;
            padding: 16px 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }
        
        .nav-button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
        }
        
        .nav-button:hover {
            background: #444;
            border-color: #555;
        }
        
        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-section">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="info-section">
            <div class="step-header">
                <div class="step-number">Step <span id="stepNum">1</span></div>
                <div class="step-title" id="stepTitle">Loading...</div>
                <div class="step-description" id="stepDesc">Loading step information...</div>
            </div>
            
            <div class="step-content">
                <div class="info-group">
                    <div class="info-label">Parts used</div>
                    <ul class="parts-list" id="partsList">
                        <li>Loading...</li>
                    </ul>
                </div>
                
                <div class="info-group">
                    <div class="info-label">Tools needed</div>
                    <div class="tools-text" id="toolsText">Loading...</div>
                </div>
            </div>
            
            <div class="step-counter" id="stepCounter">Step 1 of 12</div>
            
            <div class="navigation">
                <button class="nav-button" id="prevBtn">← Previous</button>
                <button class="nav-button" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/three@0.124.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // JSON DATA EMBEDDED IN HTML
        const stepsData = [
            {
                stepNumber: 1,
                title: "Complete Robot Assembly",
                description: "Full embroidery robot showing all parts",
                partsToShow: [],
                partsUsedNames: ["Full Assembly"],
                tools: "No tools required"
            },
            {
                stepNumber: 2,
                title: "Part empty_2",
                description: "Showing part empty_2",
                partsToShow: ["empty_2"],
                partsUsedNames: ["empty_2"],
                tools: ""
            },
            {
                stepNumber: 3,
                title: "Part empty_3",
                description: "Showing part empty_3",
                partsToShow: ["empty_3"],
                partsUsedNames: ["empty_3"],
                tools: ""
            },
            {
                stepNumber: 4,
                title: "Part empty_4",
                description: "Showing part empty_4",
                partsToShow: ["empty_4"],
                partsUsedNames: ["empty_4"],
                tools: ""
            },
            {
                stepNumber: 5,
                title: "Part empty_5",
                description: "Showing part empty_5",
                partsToShow: ["empty_5"],
                partsUsedNames: ["empty_5"],
                tools: ""
            },
            {
                stepNumber: 6,
                title: "Part empty_6",
                description: "Showing part empty_6",
                partsToShow: ["empty_6"],
                partsUsedNames: ["empty_6"],
                tools: ""
            },
            {
                stepNumber: 7,
                title: "Part empty_7",
                description: "Showing part empty_7",
                partsToShow: ["empty_7"],
                partsUsedNames: ["empty_7"],
                tools: ""
            },
            {
                stepNumber: 8,
                title: "Part empty_8",
                description: "Showing part empty_8",
                partsToShow: ["empty_8"],
                partsUsedNames: ["empty_8"],
                tools: ""
            },
            {
                stepNumber: 9,
                title: "Part empty_9",
                description: "Showing part empty_9",
                partsToShow: ["empty_9"],
                partsUsedNames: ["empty_9"],
                tools: ""
            },
            {
                stepNumber: 10,
                title: "Part empty_10",
                description: "Showing part empty_10",
                partsToShow: ["empty_10"],
                partsUsedNames: ["empty_10"],
                tools: ""
            },
            {
                stepNumber: 11,
                title: "Part empty_11",
                description: "Showing part empty_11",
                partsToShow: ["empty_11"],
                partsUsedNames: ["empty_11"],
                tools: ""
            },
            {
                stepNumber: 12,
                title: "Part empty_12",
                description: "Showing part empty_12",
                partsToShow: ["empty_12"],
                partsUsedNames: ["empty_12"],
                tools: ""
            }
        ];

        let currentStep = 1;
        const totalSteps = stepsData.length;

        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        // OrbitControls for rotation
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = false;
        
        // Parts to show (half of 108 parts = 54 parts)
        const partsToShow = [
            'empty_2', 'empty_3', 'empty_4', 'empty_5', 'empty_6', 'empty_7', 'empty_8', 'empty_9', 'empty_10',
            'empty_11', 'empty_12', 'empty_13', 'empty_14', 'empty_15', 'empty_16', 'empty_17', 'empty_18', 'empty_19', 'empty_20',
            'empty_21', 'empty_22', 'empty_23', 'empty_24', 'empty_25', 'empty_26', 'empty_27', 'empty_28', 'empty_29', 'empty_30',
            'empty_31', 'empty_32', 'empty_33', 'empty_34', 'empty_35', 'empty_36', 'empty_37', 'empty_38', 'empty_39', 'empty_40',
            'empty_41', 'empty_42', 'empty_43', 'empty_44', 'empty_45', 'empty_46', 'empty_47', 'empty_48', 'empty_49', 'empty_50',
            'empty_51', 'empty_52', 'empty_53', 'empty_54', 'empty_55'
        ];
        
        // First 1/4 of parts (1/4 of 54 = 13.5, so 13 parts)
        const orangeParts = partsToShow.slice(0, 13);
        
        let model = null;

        function updateStep() {
            const step = stepsData[currentStep - 1];
            
            document.getElementById('stepNum').textContent = step.stepNumber;
            document.getElementById('stepTitle').textContent = step.title;
            document.getElementById('stepDesc').textContent = step.description;
            document.getElementById('stepCounter').textContent = `Step ${step.stepNumber} of ${totalSteps}`;
            
            const partsList = document.getElementById('partsList');
            partsList.innerHTML = '';
            step.partsUsedNames.forEach((partName) => {
                const li = document.createElement('li');
                li.textContent = partName;
                partsList.appendChild(li);
            });
            
            document.getElementById('toolsText').textContent = step.tools || 'No tools required';
            
            document.getElementById('prevBtn').disabled = currentStep === 1;
            document.getElementById('nextBtn').disabled = currentStep === totalSteps;
            
            // Show parts from current step's partsToShow (cumulative, don't hide)
            if (model) {
                // Show all parts in current step
                step.partsToShow.forEach((partName) => {
                    model.traverse((child) => {
                        if (child.name === partName && child.isMesh) {
                            child.visible = true;
                            console.log('Showing:', child.name);
                        }
                    });
                });
            }
        }
        
        // Load GLB
        const loader = new THREE.GLTFLoader();
        loader.load('robot.glb', (gltf) => {
            console.log('Model loaded');
            model = gltf.scene;
            
            scene.add(model);
            
            // Fit camera
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            camera.position.z = cameraZ * 2;
            camera.lookAt(box.getCenter(new THREE.Vector3()));
            
            // Color first 1/4 orange
            model.traverse((child) => {
                if (child.isMesh && orangeParts.includes(child.name)) {
                    child.material = new THREE.MeshPhongMaterial({ color: 0xff9500 });
                }
            });
            
            // Show initial step
            updateStep();
            
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Button events
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                updateStep();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // Handle resize
        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
