<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Half Robot Test - Rotatable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        .viewer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            background: #0a0a0a;
        }
        
        canvas { 
            flex: 1;
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info-section {
            width: 380px;
            background: #1a1a1a;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .step-header {
            background: #2a2a2a;
            padding: 24px 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        
        .step-number {
            font-size: 28px;
            font-weight: 700;
            color: #ff9500;
            margin-bottom: 8px;
        }
        
        .step-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }
        
        .step-description {
            font-size: 14px;
            line-height: 1.5;
            color: #b0b0b0;
        }
        
        .step-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .info-group {
            margin-bottom: 24px;
        }
        
        .info-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .parts-list {
            list-style: none;
        }
        
        .parts-list li {
            font-size: 14px;
            color: #d0d0d0;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .parts-list li:last-child {
            border-bottom: none;
        }
        
        .parts-list li::before {
            content: "• ";
            color: #ff9500;
            margin-right: 8px;
        }
        
        .tools-text {
            font-size: 14px;
            color: #d0d0d0;
            line-height: 1.5;
        }
        
        .step-counter {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 12px 0;
        }
        
        .navigation {
            background: #2a2a2a;
            padding: 16px 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }
        
        .nav-button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
        }
        
        .nav-button:hover {
            background: #444;
            border-color: #555;
        }
        
        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-section">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="info-section">
            <div class="step-header">
                <div class="step-number">Step <span id="stepNum">1</span></div>
                <div class="step-title" id="stepTitle">Loading...</div>
                <div class="step-description" id="stepDesc">Loading step information...</div>
            </div>
            
            <div class="step-content">
                <div class="info-group">
                    <div class="info-label">Parts used</div>
                    <ul class="parts-list" id="partsList">
                        <li>Loading...</li>
                    </ul>
                </div>
                
                <div class="info-group">
                    <div class="info-label">Tools needed</div>
                    <div class="tools-text" id="toolsText">Loading...</div>
                </div>
            </div>
            
            <div class="step-counter" id="stepCounter">Step 1 of 12</div>
            
            <div class="navigation">
                <button class="nav-button" id="prevBtn">← Previous</button>
                <button class="nav-button" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/three@0.124.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        const stepsData = [
            {
                stepNumber: 1,
                subAssembly: 1,
                title: "Complete Robot Assembly",
                description: "Full embroidery robot showing all parts",
                partsToShow: ["empty_3"],
                partsUsedNames: ["Full Assembly"],
                tools: "No tools required"
            },
            {
                stepNumber: 2,
                subAssembly: 1,
                title: "Part empty_2",
                description: "Showing part empty_2",
                partsToShow: ["empty_2"],
                partsUsedNames: ["empty_2"],
                tools: ""
            },
            {
                stepNumber: 3,
                subAssembly: 1,
                title: "Part empty_3",
                description: "Showing part empty_3",
                partsToShow: ["empty_3"],
                partsUsedNames: ["empty_3"],
                tools: ""
            },
            {
                stepNumber: 4,
                subAssembly: 1,
                title: "Part empty_4",
                description: "Showing part empty_4",
                partsToShow: ["empty_4"],
                partsUsedNames: ["empty_4"],
                tools: ""
            },
            {
                stepNumber: 5,
                subAssembly: 1,
                title: "Part empty_5",
                description: "Showing part empty_5",
                partsToShow: ["empty_5"],
                partsUsedNames: ["empty_5"],
                tools: ""
            },
            {
                stepNumber: 6,
                subAssembly: 1,
                title: "Part empty_6",
                description: "Showing part empty_6",
                partsToShow: ["empty_6"],
                partsUsedNames: ["empty_6"],
                tools: ""
            },
            {
                stepNumber: 7,
                subAssembly: 2,
                title: "Part empty_7",
                description: "Showing part empty_7",
                partsToShow: ["empty_7"],
                partsUsedNames: ["empty_7"],
                tools: ""
            },
            {
                stepNumber: 8,
                subAssembly: 2,
                title: "Part empty_8",
                description: "Showing part empty_8",
                partsToShow: ["empty_8"],
                partsUsedNames: ["empty_8"],
                tools: ""
            },
            {
                stepNumber: 9,
                subAssembly: 2,
                title: "Part empty_9",
                description: "Showing part empty_9",
                partsToShow: ["empty_9"],
                partsUsedNames: ["empty_9"],
                tools: ""
            },
            {
                stepNumber: 10,
                subAssembly: 2,
                title: "Part empty_10",
                description: "Showing part empty_10",
                partsToShow: ["empty_10"],
                partsUsedNames: ["empty_10"],
                tools: ""
            },
            {
                stepNumber: 11,
                subAssembly: 3,
                title: "Part empty_11",
                description: "Showing part empty_11",
                partsToShow: ["empty_11"],
                partsUsedNames: ["empty_11"],
                tools: ""
            },
            {
                stepNumber: 12,
                subAssembly: 3,
                title: "Part empty_12",
                description: "Showing part empty_12",
                partsToShow: ["empty_12"],
                partsUsedNames: ["empty_12"],
                tools: ""
            }
        ];

        let currentStep = 1;
        const totalSteps = stepsData.length;

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = false;
        
        let model = null;
        let cumulativeParts = [];
        let previousSubAssembly = null;

        function updateStep() {
            const step = stepsData[currentStep - 1];
            
            document.getElementById('stepNum').textContent = step.stepNumber;
            document.getElementById('stepTitle').textContent = step.title;
            document.getElementById('stepDesc').textContent = step.description;
            document.getElementById('stepCounter').textContent = `Step ${step.stepNumber} of ${totalSteps}`;
            
            const partsList = document.getElementById('partsList');
            partsList.innerHTML = '';
            step.partsUsedNames.forEach((partName) => {
                const li = document.createElement('li');
                li.textContent = partName;
                partsList.appendChild(li);
            });
            
            document.getElementById('toolsText').textContent = step.tools || 'No tools required';
            
            document.getElementById('prevBtn').disabled = currentStep === 1;
            document.getElementById('nextBtn').disabled = currentStep === totalSteps;
            
            if (previousSubAssembly !== null && previousSubAssembly !== step.subAssembly) {
                cumulativeParts = [];
                console.log('SubAssembly changed from', previousSubAssembly, 'to', step.subAssembly);
            }
            previousSubAssembly = step.subAssembly;
            
            cumulativeParts = [];
            for (let i = 0; i < currentStep; i++) {
                const stepData = stepsData[i];
                if (stepData.subAssembly === step.subAssembly) {
                    cumulativeParts.push(...stepData.partsToShow);
                }
            }
            
            if (model) {
                model.traverse((child) => {
                    if (child.isMesh) child.visible = false;
                });
                
                cumulativeParts.forEach((partName) => {
                    model.traverse((child) => {
                        if (child.name === partName && child.isMesh) {
                            child.visible = true;
                            child.material = new THREE.MeshPhongMaterial();
                        }
                    });
                });
                
                step.partsToShow.forEach((partName) => {
                    model.traverse((child) => {
                        if (child.name === partName && child.isMesh) {
                            child.visible = true;
                            child.material = new THREE.MeshPhongMaterial({ color: 0xff9500 });
                            console.log('Showing (orange):', child.name);
                        }
                    });
                });
            }
        }
        
        const loader = new THREE.GLTFLoader();
        loader.load('robot.glb', (gltf) => {
            console.log('Model loaded');
            model = gltf.scene;
            
            scene.add(model);
            
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            camera.position.z = cameraZ * 2;
            camera.lookAt(box.getCenter(new THREE.Vector3()));
            
            model.traverse((child) => {
                if (child.isMesh && orangeParts.includes(child.name)) {
                    child.material = new THREE.MeshPhongMaterial({ color: 0xff9500 });
                }
            });
            
            updateStep();
            
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                updateStep();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
