<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Single Mesh Test - empty_4</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script src="https://unpkg.com/three@0.124.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        // Load GLB
        const loader = new THREE.GLTFLoader();
        loader.load('robot.glb', (gltf) => {
            console.log('Model loaded');
            
            // Hide all meshes
            gltf.scene.traverse((child) => {
                if (child.isMesh) child.visible = false;
            });
            
            // Show only empty_4
            gltf.scene.traverse((child) => {
                if (child.name === 'empty_4' && child.isMesh) {
                    child.visible = true;
                    console.log('Showing:', child.name);
                }
            });
            
            scene.add(gltf.scene);
            
            // Fit camera
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            camera.position.z = cameraZ * 2;
            camera.lookAt(box.getCenter(new THREE.Vector3()));
            console.log('Camera positioned');
            
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
