<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Half Robot Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script src="https://unpkg.com/three@0.124.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        // Parts to show (half of 108 parts = 54 parts)
        const partsToShow = [
            'empty_2', 'empty_3', 'empty_4', 'empty_5', 'empty_6', 'empty_7', 'empty_8', 'empty_9', 'empty_10',
            'empty_11', 'empty_12', 'empty_13', 'empty_14', 'empty_15', 'empty_16', 'empty_17', 'empty_18', 'empty_19', 'empty_20',
            'empty_21', 'empty_22', 'empty_23', 'empty_24', 'empty_25', 'empty_26', 'empty_27', 'empty_28', 'empty_29', 'empty_30',
            'empty_31', 'empty_32', 'empty_33', 'empty_34', 'empty_35', 'empty_36', 'empty_37', 'empty_38', 'empty_39', 'empty_40',
            'empty_41', 'empty_42', 'empty_43', 'empty_44', 'empty_45', 'empty_46', 'empty_47', 'empty_48', 'empty_49', 'empty_50',
            'empty_51', 'empty_52', 'empty_53', 'empty_54', 'empty_55'
        ];
        
        // Load GLB
        const loader = new THREE.GLTFLoader();
        loader.load('robot.glb', (gltf) => {
            console.log('Model loaded');
            
            // Hide all meshes first
            gltf.scene.traverse((child) => {
                if (child.isMesh) child.visible = false;
            });
            
            // Show only parts in our list
            gltf.scene.traverse((child) => {
                if (child.isMesh && partsToShow.includes(child.name)) {
                    child.visible = true;
                    console.log('Showing:', child.name);
                }
            });
            
            scene.add(gltf.scene);
            
            // Fit camera
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            camera.position.z = cameraZ * 2;
            camera.lookAt(box.getCenter(new THREE.Vector3()));
            console.log('Camera positioned');
            console.log('Total parts shown:', partsToShow.length);
            
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
